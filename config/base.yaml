zotero:
  user_id: ??? # User ID of your Zotero account.
  api_key: ??? # An Zotero API key with read access.
  include_path: null # A list of glob patterns marking the Zotero collections that should be included. Example: ["2026/survey/**","2026/reading-group/**"]
  ignore_path: null # A list of glob patterns marking the Zotero collections that should be excluded. Example: ["2026/ignore/**","archive/**"]

source:
  arxiv:
    category: null # The categories of target arxiv papers. Find the abbr of your research area from [here](https://arxiv.org/category_taxonomy). Example: ["cs.AI","cs.CV","cs.LG","cs.CL"]
    include_cross_list: false # Whether to include arXiv cross-list papers in subscribed categories. Example: true
  biorxiv:
    category: null # The categories of target biorxiv papers. Find categories from [here](https://www.biorxiv.org/). Example: ["biochemistry","animal behavior and cognition"]
  medrxiv:
    category: null # The categories of target medrxiv papers. Find categories from [here](https://www.medrxiv.org/) Example: ["psychiatry and clinical psychology", "neurology"]
  pubmed:
    api_key: ${oc.env:NCBI_API_KEY,null}   # Optional NCBI key; lifts the rate limit from 3 to 10 req/s. Self-service, issued instantly.
    email: ${oc.env:CONTACT_EMAIL,null}    # Contact address sent with E-utilities requests, per NCBI's usage policy.
    tool: zotero-cmc-weekly               # Tool name sent with E-utilities requests.
  crossref:
    mailto: ${oc.env:CONTACT_EMAIL,null}   # Joins Crossref's polite pool: better latency, fewer throttles.
  openalex:
    mailto: ${oc.env:CONTACT_EMAIL,null}   # Joins OpenAlex's polite pool.
  europepmc: {}                           # No credentials required.
  chemrxiv:
    include_new_versions: false # Whether to include revised versions (v2, v3, ...) of previously posted chemrxiv preprints in addition to new first postings. chemrxiv has no category filter: all new preprints (a few dozen per day) are retrieved via Crossref and left to the reranker. Example: true

email:
  sender: ??? # The email account of the SMTP server that sends you email. Example: abc@qq.com
  receiver: ??? # The email account that receives the paper list. Example: abc@outlook.com
  recipients: ${oc.env:RECIPIENTS,null} # The weekly digest recipient list; all are Bcc'd. A YAML list or one delimited string. Falls back to `receiver` when unset. Example: "a@corp.com, b@corp.com"
  smtp_server: ??? # The SMTP server that sends the email. Ask your email provider (Gmail, QQ, Outlook, ...) for its SMTP server. Example: smtp.qq.com
  smtp_port: ??? # The port of SMTP server. Example: 465
  sender_password: ??? # The password of the sender account. Note that it's not necessarily the password for logging in the e-mail client, but the authentication code for SMTP service. Ask your email provider for this. Example: abcdefghijklmn

llm:
  api:
    key: ??? # API Key of your LLM API. Example: sk-xxx
    base_url: ??? # API URL of your LLM API. Example: https://api.openai.com/v1
  generation_kwargs:
  # Arguments for the LLM API. See [here](https://platform.openai.com/docs/api-reference/chat/create) for more details.
    max_tokens: 16384
    model: ???
  language: English # Preferred language for the TL;DR. Example: English

reranker:
  vector_cache: null # Cache the corpus embeddings between runs, e.g. state/corpus_vectors.npz.
  # The corpus barely changes but the runner is ephemeral, so it is re-embedded every week
  # (measured ~3.9 s/paper). Candidates are new each week and are never cached.
  local:
    model: jinaai/jina-embeddings-v5-text-nano-retrieval # The Hugging Face model name of the local embedding model. Example: jinaai/jina-embeddings-v5-text-nano
    encode_kwargs:
    # The kwargs for the encode method of the local embedding model. Details see [here](https://www.sbert.net/docs/package_reference/SentenceTransformer.html#sentence_transformers.SentenceTransformer.encode)
      task: retrieval
      prompt_name: document
  api:
    key: null # API Key of your embedding model API. Example: sk-xxx
    base_url: null # API URL of your embedding model API. Example: https://api.openai.com/v1
    model: null # The model name of the embedding model. Example: text-embedding-3-large
    batch_size: null # The batch size for embedding API requests. Adjust to match your provider's limit. Example: 64

executor:
  debug: false # Whether to use debug mode. Example: true
  send_empty: false # Whether to send an empty email even if no new papers today. Example: true
  max_paper_num: 100 # The maximum number of the papers presented in the email. Example: 100
  source: ??? # The sources of papers to retrieve. Example: ['arxiv','biorxiv','medrxiv','chemrxiv']
  reranker: local # The reranker to use. Example: 'local' or 'api'

search:
  sources: ['pubmed','europepmc','crossref','openalex'] # Query-style sources used by the weekly digest.
  n_clusters: 5           # How many themes to group the Zotero corpus into.
  per_cluster_limit: 25   # Max candidates fetched per cluster per source.
  # A candidate's cluster is picked by blending two signals: the mean
  # similarity to a theme's corpus members (diffuse — a paper that merely
  # shares surface vocabulary with a theme's papers can score well here even
  # when it isn't really about what the theme covers), and the candidate's
  # similarity to the theme's own one-sentence description (sharper, since
  # the description is a deliberate topical summary). This is the weight on
  # the description signal; 0 disables it and falls back to corpus-mean-only
  # routing, 1 ignores the corpus signal entirely.
  cluster_assignment_description_weight: 0.6
  cluster_cache: state/theme_clusters.json  # Rebuilt only when the corpus changes.
  profile_cache: state/query_profiles.json  # Rebuilt only when the cluster set changes.
  seen_state: state/seen_dois.json          # DOIs already delivered, for cross-week de-duplication.
  # —— 特定主题（可选的第二条检索线）——
  # 库内主题是从 Zotero 语料聚出来的；这一节是你自己点名要追的方向，可以和库
  # 内主题无关。topic 留空（默认）= 整条线不启用：不发 LLM 请求、不检索、周报
  # 里没有这一节。相关度用的是"与这个主题相关吗"，不是全局那把生物药 CMC 尺子。
  focus:
    topic: ${oc.env:FOCUS_TOPIC,null}            # 要追的主题，如"连续制造在单抗原液生产中的应用"
    background: ${oc.env:FOCUS_BACKGROUND,null}  # 可选背景，帮模型生成更贴切的检索式
    min_papers: 3          # 少于这么多时，用该主题的高被引经典补足
    max_papers: 8          # 这一节最多收录几篇
    min_relevance: 60      # 与该主题的相关度下限（0-100，由 LLM 判定）

fulltext:
  enabled: true            # Whether to attempt open-access full-text retrieval.
  unpaywall_email: ${oc.env:CONTACT_EMAIL,null} # Required by the Unpaywall API; without it that rung of the ladder is skipped.
  max_bytes: 20000000      # Reject any single PDF larger than this.

report:
  # Two independent knobs, not one range: max_papers caps the fresh quota
  # (allocate_quota), min_papers is the floor a thin week tops up towards
  # with highly-cited backfill (spec 8.5). Backfill is best-effort — if
  # OpenAlex has too few citable, on-theme classics to reach min_papers, the
  # digest still ships smaller than this and a WARNING names why (see
  # backfill_papers() / WeeklyExecutor.run()) rather than failing silently.
  min_papers: 15           # Below this many fresh papers, top up with highly-cited backfill.
  max_papers: 25           # Hard ceiling on the digest length (fresh papers only; quota total).
  top_picks: 3             # Size of the "read these first" section.
  min_per_cluster: 1       # Floor so a small theme is never crowded out.
  # —— 相关性闸门 ——
  min_relevance: 55        # 分诊给出的原始相关度下限。期刊/企业加分不能突破这条线。
  min_score: 60            # 综合分下限 = 相关度 + 期刊加分 + 企业加分。
  triage_pool: 60          # 送去分诊的候选上限，按嵌入相似度取前 N。候选不足则全送。
  triage_batch: 8          # 每次分诊调用处理几篇。调小更稳，调大更省。
  journals:
