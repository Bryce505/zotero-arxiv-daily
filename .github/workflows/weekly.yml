name: CMC literature weekly digest

on:
  workflow_dispatch:
  schedule:
    # 12:00 UTC on Friday = 20:00 Asia/Shanghai
    - cron: '0 12 * * 5'

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync

      - name: Build and send the digest
        env:
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_API_KEY }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          SENDER: ${{ secrets.SENDER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECIPIENTS: ${{ secrets.RECIPIENTS }}
          # Either place works: a topic is not a secret, but an operator who
          # adds it as one should not have to discover that it silently did
          # nothing. An unset name is an empty string, so || picks the other.
          FOCUS_TOPIC: ${{ secrets.FOCUS_TOPIC || vars.FOCUS_TOPIC }}
          FOCUS_BACKGROUND: ${{ secrets.FOCUS_BACKGROUND || vars.FOCUS_BACKGROUND }}
          CUSTOM_CONFIG: ${{ vars.CUSTOM_CONFIG }}
        run: |
          printf "%b\n" "$CUSTOM_CONFIG" > config/custom.yaml
          uv run src/zotero_arxiv_daily/weekly.py

